global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  # Pipeline services
  - job_name: validator
    static_configs:
      - targets: ["validator:8001"]
    metrics_path: /metrics

  - job_name: feature-writer
    static_configs:
      - targets: ["feature-writer:8002"]
    metrics_path: /metrics

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Infrastructure exporters
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
