groups:
  - name: pipeline_alerts
    rules:
      # Consumer lag > 50K messages for > 5 minutes
      - alert: HighConsumerLag
        expr: kafka_consumergroup_lag_sum > 50000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High consumer lag on {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} has lag {{ $value }} on topic {{ $labels.topic }}"

      # Validation rejection rate > 20% of consumed events for > 2 minutes
      - alert: HighValidationRejectRate
        expr: >
          rate(validator_rejected_total[2m]) /
          (rate(validator_validated_total[2m]) + rate(validator_rejected_total[2m]) + 0.001)
          > 0.20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High schema validation rejection rate"
          description: "Validation reject rate is {{ $value | humanizePercentage }}"

      # Writer error rate > 5% for > 2 minutes
      - alert: WriterErrorRate
        expr: >
          rate(writer_errors_total[2m]) /
          (rate(writer_writes_total[2m]) + rate(writer_errors_total[2m]) + 0.001)
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Feature writer error rate is high"
          description: "Writer error rate is {{ $value | humanizePercentage }}"

      # API p99 latency > 500ms for > 5 minutes
      - alert: HighAPILatency
        expr: >
          histogram_quantile(0.99,
            rate(api_request_latency_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency is high"
          description: "API p99 latency is {{ $value | humanizeDuration }}"

      # Postgres connections > 80% of max
      - alert: HighPostgresConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of Postgres connections"
          description: "{{ $value }} active connections"
